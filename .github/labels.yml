# revvel-standards canonical label set
# Synced automatically via .github/workflows/sync-labels.yml

# ── Status ──────────────────────────────────────────────────────────────────
- name: "status: ready"
  color: "0075ca"
  description: "Ready to be picked up"

- name: "status: in-progress"
  color: "e4e669"
  description: "Actively being worked on"

- name: "status: blocked"
  color: "d93f0b"
  description: "Blocked by a dependency or decision"

- name: "status: review"
  color: "b60205"
  description: "Awaiting code review or approval"

- name: "status: done"
  color: "0e8a16"
  description: "Complete and merged"

# ── Type ────────────────────────────────────────────────────────────────────
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality"

- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken"

- name: "type: chore"
  color: "fef2c0"
  description: "Maintenance, deps, config"

- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"

- name: "type: refactor"
  color: "e4e669"
  description: "Code restructure without behavior change"

- name: "type: test"
  color: "c5def5"
  description: "Test coverage additions or fixes"

- name: "type: security"
  color: "ee0701"
  description: "Security fix or hardening"

# ── Priority ────────────────────────────────────────────────────────────────
- name: "priority: critical"
  color: "b60205"
  description: "Must ship — blocks release"

- name: "priority: high"
  color: "d93f0b"
  description: "Important — address this sprint"

- name: "priority: medium"
  color: "e4e669"
  description: "Normal priority"

- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

# ── Product ─────────────────────────────────────────────────────────────────
- name: "product: zenodo-auto-publish"
  color: "5319e7"
  description: "Zenodo auto-publish script"

- name: "product: whitepaper"
  color: "1d76db"
  description: "Whitepaper / publication module"

# ── Release ─────────────────────────────────────────────────────────────────
- name: "release: v1.0"
  color: "0e8a16"
  description: "Targeting v1.0 launch"

- name: "release: v1.1"
  color: "c5def5"
  description: "Targeting v1.1"

# ── Meta ────────────────────────────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
