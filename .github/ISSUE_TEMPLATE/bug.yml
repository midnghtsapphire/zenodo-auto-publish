name: Bug Report
description: Report a broken or unexpected behavior
title: "fix: "
labels:
  - "type: bug"
  - "status: ready"
  - "priority: high"
  - "product: zenodo-auto-publish"
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the bug report below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce this?
      placeholder: |
        1. Run `python zenodo_auto_publish.py --token ... --file ...`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or stack traces.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, Zenodo environment (sandbox/live)
      placeholder: |
        - Python: 3.12
        - OS: macOS 14
        - Zenodo: sandbox
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: critical"
        - "priority: high"
        - "priority: medium"
        - "priority: low"
    validations:
      required: true
